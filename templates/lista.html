{% extends "template.html" %}
{% block conteudo %}
      <table class="table table-striped table-responsive table-bordered">
         <thead class="thead-default">
            <tr>
               <th>Id</th>
               <th>None</th>
               <th>Categoria</th>
               <th>Console</th>
               <th></th>
            </tr>
        </thead>
        <tbody>
         {% for jogo in lista %}
           <tr>
              <td>{{ jogo.id }}</td>
              <td>{{ jogo.nome }}</td>
              <td>{{ jogo.categoria }}</td>
              <td>{{ jogo.console }}</td>
              <td><a href="{{ url_for('editar', id=jogo.id) }}">Editar</a></td>
           </tr>
         {% endfor %}
        </tbody>
     </table>
{% endblock %}
